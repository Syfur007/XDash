# =============================================================================
# Experiment Dashboard — settings
# =============================================================================
# Everything the dashboard needs to know about the repo it lives in.
# Edit `repo_root` if you move this folder somewhere else; every other path
# below is resolved relative to it, so the whole `exp_dashboard/` directory
# can be copied into (or out of) any repo that follows the same layout.

repo_root: ".."               # path to the repo root, relative to this file

configs_dir: "configs"        # where .yaml / .yml experiment configs live
logs_dir: "logs"              # where train.py / eval.py write their log files
runs_dir: "runs"              # TensorBoard event directory
checkpoints_dir: "checkpoints"
plots_dir: "logs"             # where eval.py writes plots/overlays/images — browsable in the History tab
# reports_dir: "logs"          # where eval.py writes *_report.json files for the Reports tab — defaults to logs_dir if unset

# Where the orchestration layer writes run manifests/ledger, if the host repo has
# adopted that layout (artifacts/runs/<run_id>/manifest.json, artifacts/ledger/*.csv)
# — powers the Runs and Ledger views. Safe to leave at the default even if this
# directory doesn't exist yet: those views just show "no runs recorded yet".
artifacts_dir: "artifacts"

python_executable: "python"   # interpreter used to launch train.py / eval.py
train_script: "train.py"
eval_script: "eval.py"

# Interpreter used for "bridge" calls into the host repo's own code — schema-aware
# config validation, model-registry introspection, and similar features that need
# the host repo's actual dependencies (pydantic, torch, ...) importable, which the
# dashboard's own minimal requirements.txt deliberately does not install. Leave
# blank to reuse python_executable above (the common case: one env runs everything).
bridge_python_executable: ""

# Extra flags always appended to eval runs (besides --config)
eval_default_args: ["--ensemble"]

# ---------------------------------------------------------------------------
# Every experiment is run inside its own tmux session, exactly like you'd run
# it by hand: a session is created, `cd` into repo_root, this activation
# command is typed (if set), then the train/eval command is typed. Output is
# streamed to the dashboard by polling the tmux pane.
#
# Examples:
#   env_activate_cmd: "conda activate thesis"
#   env_activate_cmd: "source ~/miniconda3/bin/activate thesis"
#   env_activate_cmd: "source .venv/bin/activate"
# Leave blank to run with whatever environment the dashboard server itself
# was started in.
env_activate_cmd: "conda activate thesis"

tmux_session_prefix: "xdash"
tmux_pane_width: 500     # wide pane so long log lines don't wrap and break parsing
tmux_pane_height: 50
tmux_history_limit: 100000

# Loopback-only by default: every API here is unauthenticated unless
# api_token (below) is set, and several endpoints (Terminals, Monitors,
# Scheduler) can run arbitrary shell commands on this machine. Only widen
# server_host/tensorboard_host beyond 127.0.0.1 if this host is on a
# network you trust completely, and set api_token first.
server_host: "127.0.0.1"
server_port: 6070

tensorboard_port: 6006
tensorboard_host: "127.0.0.1"

# Shared secret required via the X-Api-Token header for every state-changing
# request (launching/killing terminals, editing configs, adding monitors,
# etc). Leave blank to disable — acceptable only while server_host stays at
# 127.0.0.1. Set this to a long random value before binding any wider.
api_token: ""

# How often the frontend polls terminals/status, in milliseconds
poll_interval_ms: 2000

# Scheduler ceilings — max_concurrent (set from the Scheduler tab) is capped
# at scheduler_max_concurrent_limit, and the item queue refuses new items
# past scheduler_max_queue_size, so a caller can't spawn unbounded tmux
# sessions / training processes.
scheduler_max_concurrent_limit: 8
scheduler_max_queue_size: 200

# Path/name of the `kaggle` CLI used by the Kaggle tab to push/pull/status
# notebooks across multiple accounts. Leave as "kaggle" if it's on the PATH
# the dashboard server itself runs under; otherwise point it at an absolute
# path (e.g. a conda env's bin/kaggle) the way env_activate_cmd above does
# for training runs.
kaggle_executable: "kaggle"
kaggle_push_concurrency: 3        # max concurrent push/status/download calls across accounts
kaggle_default_budget_hours: 9.5  # session-length guardrail fallback when a worker has none set

# Shared launch-template notebook a template-backed worker (the default — no notebook_path set)
# renders config_path/mode/extra_args into before every push, unless it has its own
# template_path override. Repo-relative. See notebooks/kaggle_worker_template.ipynb.
kaggle_default_template: "notebooks/kaggle_worker_template.ipynb"

# The background poller (backend/kaggle.py's ensure_kaggle_worker_started/
# _tick) checks any pushed-but-not-yet-final worker on this cadence, in
# seconds — it's what fires the webhook below and drives chained auto-push
# even when nobody has the Kaggle tab open. Floored at 30s regardless of
# what's set here, to stay well clear of Kaggle's own API rate limits.
kaggle_poll_interval_seconds: 180

# Optional Slack/Discord-compatible incoming-webhook URL. Left blank,
# nothing is sent. When set, the poller POSTs a plain {"text": "..."} body
# whenever a pushed worker reaches a final status (complete/error/
# cancelAcknowledged) — best-effort, a failed webhook call never affects
# anything else the poller does.
kaggle_webhook_url: ""
