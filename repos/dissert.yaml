# =============================================================================
# Experiment Dashboard — repo profile: dissert
# =============================================================================
# One of XDash/repos/*.yaml — a named profile the dashboard can switch to at
# runtime (MULTI_REPO_PLAN.md §3). `repo_root` below is resolved relative to
# *this file's own directory* (XDash/repos/), not to XDash's root.
#
# Built from scratch against dissert's OUTPUT_LAYOUT.md (the nested,
# experiment-first layout, commit fec2a9a) — deliberately not reusing the old
# uncommitted dashboard_config.yaml edit this checkout carried before the
# multi-repo refactor, which predates that layout and pointed at the stale
# flat outputs/{logs,runs,checkpoints,artifacts} dirs.

display_name: "dissert"

logs_dir: "outputs/experiments"
runs_dir: "outputs/experiments"
checkpoints_dir: "outputs/experiments"
plots_dir: "outputs/experiments"
reports_dir: "outputs/experiments"

# Ledger lives at outputs/ledger/ — a sibling of outputs/experiments/, NOT
# nested under an "artifacts" dir the way segpriors' is. ledger_dir is its
# own independently-configurable key precisely so this doesn't need an
# artifacts_dir concept that doesn't exist in this layout (MULTI_REPO_PLAN.md
# §2/§3). artifacts_dir itself is left at its harmless default (unused by
# anything when manifest_layout is "experiments").
ledger_dir: "outputs/ledger"

# manifest.json lives at outputs/experiments/<experiment_id>/checkpoints/
# [fold{N}/]manifest.json — a different shape from segpriors' flat
# artifacts/runs/<run_id>/manifest.json glob. This is the one discriminator
# ledger.py branches on (MULTI_REPO_PLAN.md §2/§3).
manifest_layout: "experiments"

bridge_python_executable: "/home/syfur/miniconda3/envs/thesis/bin/python"

# Framework hooks (XDASH_PLAN.md §4). `xdash:dissert.locate_run` is the
# XDash-shipped adapter in backend/bridge_scripts/adapters/dissert.py: it
# computes the run dir dissert will write (load_config -> config_hash ->
# experiment_paths) before launch, and XDash stores it on the attempt (§4.4).
# `resolve_config` is dissert's own loader (compose-merge + schema
# validation); XDash calls it with one config path to validate an overlay
# when an experiment is composed, so a typo'd key fails then, not at hour
# three of a run (§4.3).
# resolve_config points at the XDash-shipped adapter (not dissert's module path
# directly) so it survives dissert's src/dissert/ package reorg without an edit
# here: the adapter tries the new `dissert.config.loader:load_config` path first,
# then falls back to the old `utils.config:load_config` one. See
# XDASH_PROGRESS.md's Phase 2 section for the switch-over checklist.
hooks:
  locate_run: "xdash:dissert.locate_run"
  resolve_config: "xdash:dissert.resolve_config"

# XDASH_PLAN.md §4.3 — an experiment's overrides (`overlay`, dotted keys like
# training.epochs) are written at dispatch as
# <repo_root>/.xdash/overlays/<experiment_id>.yaml:
#     compose: ["../../configs/experiment/.../x.yaml"]
#     training: {epochs: 50}
# and train.py and eval.py both get `--config` that file, so they resolve the
# same config and the same config_hash (X12). This names the include key of
# dissert's loader (utils/config.py; paths resolve relative to the including
# file). dissert's .gitignore should list `.xdash/`.
eval_default_args: ["--allow-test-eval"]

# XDASH_PLAN.md §4.5 — Kaggle clones dissert from GitHub and checks out the
# commit recorded at dispatch. A dirty tree or an unpushed commit blocks the
# Kaggle dispatch with `code-not-pushed`; true downgrades that to a warning
# recorded on the attempt (and Kaggle then runs the pushed commit / the
# default branch, not your local changes).
allow_unpushed: false

tmux_pane_width: 500
tmux_pane_height: 50
tmux_history_limit: 100000

# server_host/server_port/api_token are deployment-level, not per-profile —
# whatever the first-loaded profile at process start declares wins for the
# life of the process; a later `switch to dissert` never rebinds the socket
# or the auth token (MULTI_REPO_PLAN.md §4). Left here only for
# documentation/standalone-use; the running server won't re-read these on a
# switch.
server_host: "127.0.0.1"
server_port: 6070

tensorboard_port: 6006
tensorboard_host: "127.0.0.1"

api_token: ""

poll_interval_ms: 2000

scheduler_max_concurrent_limit: 8
scheduler_max_queue_size: 200

kaggle_push_concurrency: 3
kaggle_default_budget_hours: 9.5
kaggle_poll_interval_seconds: 180
kaggle_webhook_url: ""
# DATASETS_PLAN.md §10 item 7 — kaggle_dataset_map is retired: each dataset's
# Kaggle slug now lives in exactly one place, data/dissert/datasets.json (the
# dataset registry), seeded once from this key's old value and from
# data/dissert/dataset_map.json the first time that registry is written.
# backend/config.py no longer reads this key at all.
#
# §8.4 — channel-mode labels for the sample preview's montage (today's
# m1-m5), read by the Datasets screen instead of the labels index.html used
# to hard-code. Leave this out entirely to hide the channel-preview part of
# the sample grid.
datasets:
  channel_modes:
    m1: "m1 — RGB (3)"
    m2: "m2 — RGB+XY (5)"
    m3: "m3 — RGB+YCbCr (6)"
    m4: "m4 — RGB+XY+Rθ (7)"
    m5: "m5 — all (10/11)"
framework:
  repo_root: "../../dissert"  # path to the repo root, relative to this file

  configs_dir: "configs"      # where .yaml / .yml experiment configs live

# dissert's whole outputs/ tree is nested per experiment_id
# ("<experiment_name>-s<seed>") rather than split by artifact type, so
# logs_dir/runs_dir/plots_dir/reports_dir all point at the same root —
# each reader below finds what it needs by walking or by content, not by a
# type-specific subpath (MULTI_REPO_PLAN.md §2):
#   - reports.py finds report.json files by content ("metrics" key), so
#     nested outputs/experiments/*/eval/report.json is found the same way
#     flat logs/*/report.json is.
#   - tensorboard_manager.py just execs `tensorboard --logdir <runs_dir>`,
#     which already recursively discovers nested run subdirectories.
#   - history.py's tree walk will also surface .pth/checkpoint files as inert
#     "binary" entries under this root — harmless noise, not a blocker
#     (MULTI_REPO_PLAN.md §2's optional Phase 6 polish item).
  overlay_compose_key: "compose"

# dissert's eval.py refuses to touch the test set without a recorded test
# token: with neither --test-token nor --allow-test-eval it logs an error and
# exits 0 having evaluated nothing, so every XDash eval produced no report.
# --allow-test-eval mints one token per evaluated seed and records it in
# outputs/ledger/test_evals.csv — dissert's own mechanism for exactly this
# kind of manual (non-sweep) eval. (--ensemble is deliberately absent: it
# means fold-ensemble in dissert, not a sane default.)
commands:
  python: "python"            # interpreter used to launch train.py / eval.py

# Corrected 2026-09 (EXPERIMENT_AUTOMATION_PLAN.md §2.1): dissert's own
# train.py DOES take a seed directly — `--seed N` (single) or `--seeds N…`
# (mutually exclusive), see dissert/train.py's parse_args() — unlike
# segpriors, which needs its scripts/run_iccit_sweep.py wrapper because bare
# train.py has no --seed flag at all. No wrapper is required here; the
# previous version of this comment claimed otherwise and was wrong.
  env_activate: "conda activate thesis"

# Left unset: defaults to "xdash-dissert" (MULTI_REPO_PLAN.md §5), distinct
# from segpriors' "xdash" prefix so sessions from either profile never
# collide even though the two repos share a lot of config-name vocabulary.
# tmux_session_prefix: "xdash-dissert"
  train: '{python} train.py --config {config} --seeds {seed} --repeats 1 {budget} {resume} {extra}'
  eval: '{python} eval.py --config {config} --seeds {seed} --repeats 1 {extra}'
  budget: --max-hours {hours}
  resume: --resume
metrics:
  lower_is_better:
  - hd95
  - asd
  - mean_ms
  - median_ms
  - std_ms
  - p95_ms
  - eval_duration_s
  - ece
